x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    env_file: .env.pilot
    environment:
      APP_MODE: max
      MINIAPP_DATABASE_PATH: /app/data/pilot.sqlite3
    volumes:
      - pilot-data:/app/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8765/health',headers={'Host':os.environ['PUBLIC_ORIGIN'].split('/')[2]}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: [python, worker.py]
    env_file: .env.pilot
    environment:
      APP_MODE: max
      MINIAPP_DATABASE_PATH: /app/data/pilot.sqlite3
      DATABASE_PATH: /app/data/bot.sqlite3
    volumes:
      - pilot-data:/app/data
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
  backup:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: [python, backup.py, --loop]
    volumes:
      - pilot-data:/app/data
      - backup-data:/backups
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
  https:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.pilot}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
volumes:
  pilot-data:
  caddy-data:
  caddy-config:
  backup-data:
